<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purpose in Life</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px;
            color: #333;
        }

        .container {
            background: white;
            padding: 30px; /* Increased padding */
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 80%; /* Adjusted width */
            width: 500px; /* Ensures proper display */
            margin: auto;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2em;
            margin-bottom: 10px; /* Added space below */
        }


        p {
            font-size: 1.2em;
            line-height: 1.5;
            text-align: justify; /* Aligns text for better readability */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Purpose in Life</h1>
        <p>My purpose in life is to learn and improve every day. I want to help my family and be a good person. I aim to live a life that makes me and my loved ones proud.</p>
    </div>
</body>
</html>
